
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratima: A Cinematic Dream ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; background-color: #0a0a0a; color: #ffffff; font-family: 'Playfair Display', serif; text-align: center; }
        header { padding: 80px 20px; border-bottom: 1px solid #333; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #d4af37; margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px 20px; }
        .photo-box img { width: 100%; height: auto; border: 1px solid #d4af37; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .caption { font-family: 'Dancing Script', cursive; color: #d4af37; margin-bottom: 10px; font-size: 1.2rem; }
        .btn { background: transparent; color: #d4af37; padding: 15px 30px; border: 1px solid #d4af37; cursor: pointer; letter-spacing: 2px; }
        .reveal { opacity: 0; transform: translateY(20px); transition: 1s all ease; }
        .reveal.active { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

<audio id="lanaSong" loop>
    <source src="https://files.catbox.moe/7ynnv6.mp3" type="audio/mpeg">
</audio>

<header>
    <div class="reveal">
        <h1>Pratima</h1>
        <p>"Will you still love me when I'm no longer young and beautiful?"</p>
        <button class="btn" onclick="celebrate()">Enter the Cinema 🎵</button>
    </div>
</header>

<div class="gallery" id="main-gallery">
    <div class="photo-box reveal"><div class="caption">"Young and Beautiful"</div><img src="IMG_20260120_101804.png"></div>
    <div class="photo-box reveal"><div class="caption">"Stars in your eyes"</div><img src="IMG_20260120_101742.png"></div>
    <div class="photo-box reveal"><div class="caption">"Diamond soul"</div><img src="IMG_20260120_101709.png"></div>
    <div class="photo-box reveal"><div class="caption">"Golden days"</div><img src="IMG_20260120_101648.png"></div>
    <div class="photo-box reveal"><div class="caption">"Love you forever"</div><img src="IMG-20260120-WA0080.jpg"></div>
    <div class="photo-box reveal"><div class="caption">"Summertime"</div><img src="IMG-20260120-WA0076.jpg"></div>
    <div class="photo-box reveal"><div class="caption">"Butterfly"</div><img src="IMG_20260120_095330.png"></div>
    <div class="photo-box reveal"><div class="caption">"The Muse"</div><img src="IMG-20260120-WA0008.jpg"></div>
</div>

<footer>LANA CORE — 2026</footer>

<script>
    function celebrate() {
        document.getElementById('lanaSong').play();
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#d4af37', '#ffffff'] });
        document.getElementById('main-gallery').scrollIntoView({ behavior: 'smooth' });
    }
    window.addEventListener('scroll', () => {
        document.querySelectorAll('.reveal').forEach(el => {
            if (el.getBoundingClientRect().top < window.innerHeight - 100) el.classList.add('active');
        });
    });
</script>

</body>
</html>
